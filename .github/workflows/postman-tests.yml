name: Automated API tests using Postman CLI

on: push

jobs:
  automated-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh
      - name: Login to Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}
      - name: Run API tests
        run: |
          mkdir -p reports
          postman collection run "21443378-360529d1-f81e-471c-813f-e2173af5f95c" -e "21443378-c8f5d8e0-2566-4c55-8525-66e23e21076e" -r cli,json --reporter-json-export reports/test-report.json
      - name: Upload Test Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: postman-test-report
          path: reports/test-report.json
